<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD13B"/>
      <stop offset="1" stop-color="#026D63"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81C332"/>
      <stop offset="1" stop-color="#026D63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#012B26" flood-opacity=".35"/>
    </filter>
    <symbol id="wheat" viewBox="-80 -210 160 420">
      <g fill="currentColor">
        <path d="M-7 200 C -4 110 -2 0 -7 -120 L 7 -120 C 2 0 4 110 7 200 Z"/>
        <ellipse cx="0" cy="-160" rx="24" ry="50"/>
        <ellipse cx="-32" cy="-100" rx="23" ry="48" transform="rotate(-30 -32 -100)"/>
        <ellipse cx="32" cy="-100" rx="23" ry="48" transform="rotate(30 32 -100)"/>
        <ellipse cx="-32" cy="-40" rx="23" ry="48" transform="rotate(-30 -32 -40)"/>
        <ellipse cx="32" cy="-40" rx="23" ry="48" transform="rotate(30 32 -40)"/>
        <ellipse cx="-32" cy="20" rx="23" ry="48" transform="rotate(-30 -32 20)"/>
        <ellipse cx="32" cy="20" rx="23" ry="48" transform="rotate(30 32 20)"/>
      </g>
    </symbol>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- field furrows -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="22" stroke-linecap="round">
    <path d="M-40 860 Q 512 700 1064 860"/>
    <path d="M-40 950 Q 512 790 1064 950"/>
  </g>

  <!-- toggle -->
  <g filter="url(#shadow)">
    <rect x="120" y="332" width="784" height="360" rx="180" fill="#FFFFFF"/>
  </g>
  <rect x="200" y="480" width="200" height="64" rx="32" fill="#DCEFC3"/>
  <circle cx="724" cy="512" r="146" fill="url(#knob)"/>
  <use href="#wheat" x="634" y="378" width="180" height="268" color="#FFFFFF"/>
</svg>
